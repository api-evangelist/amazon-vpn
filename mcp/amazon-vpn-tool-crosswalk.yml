source: >-
  mcp/amazon-vpn-mcp.yml (live tools/list from knowledge-mcp.global.api.aws plus the
  awslabs/mcp READMEs) bound against
  openapi/amazon-vpn-aws-vpn-api-amazon-ec2-query-api-subset-api-openapi.yml
note: >-
  The Amazon EC2 Query API models every VPN operation as one HTTP POST to `/` with an
  `Action` discriminator, so the OpenAPI carries a single operationId (invokeVpnAction)
  and 33 real action values. Binding therefore names the operationId AND the Action
  value it must carry; the Action value is the unit a caller actually selects. No tool
  is invented — the two AWS stdio servers below are the only MCP surfaces that reach
  these actions, and the remote AWS Knowledge MCP server reaches none of them.
surfaces:
  openapi:
    file: openapi/amazon-vpn-aws-vpn-api-amazon-ec2-query-api-subset-api-openapi.yml
    operations: 1
    actions: 33
    gated: false
  graphql:
    endpoint: null
    note: AWS VPN publishes no GraphQL surface.
  mcp:
    - url: https://knowledge-mcp.global.api.aws/mcp
      gated: false
      tools_listed: 5
      note: tools/list returned 200 anonymously; the tool set is documentation retrieval only.
    - package: awslabs.aws-network-mcp-server
      transport: stdio
      gated: true
      note: >-
        Tool list read from the published README, not from a live tools/list — the server
        runs locally and needs AWS credentials, so input schemas would require
        authenticated introspection on a configured host.
    - package: awslabs.aws-api-mcp-server
      transport: stdio
      gated: true
      note: Same — local stdio, credentials required.
crosswalk:
  - tool: list_vpn_connections
    server: awslabs.aws-network-mcp-server
    category: site-to-site-vpn
    rest: [invokeVpnAction]
    action: DescribeVpnConnections
    binding: rest
    confidence: high
    note: >-
      Named 1:1 against the EC2 action. Read-only; the server README states the whole
      server performs read-only operations.
  - tool: call_aws
    server: awslabs.aws-api-mcp-server
    category: generic-aws-cli
    rest: [invokeVpnAction]
    action: "*"
    binding: rest
    confidence: low
    note: >-
      Generic binding, not an operation-level one. The server executes AWS CLI commands,
      so it can reach all 33 VPN actions via `aws ec2 <verb>-vpn-*` / `<verb>-client-vpn-*`,
      but it exposes no VPN-named tool and no per-action inputSchema. Confidence is low
      on purpose: an agent cannot discover the VPN surface from this tool's schema.
