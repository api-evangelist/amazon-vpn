format: aws-query-xml
note: >-
  NOT RFC 9457. The Amazon EC2 Query API returns errors as an XML envelope
  (<Response><Errors><Error><Code>…</Code><Message>…</Message></Error></Errors>
  <RequestID>…</RequestID></Response>), never application/problem+json. The OpenAPI in
  this repo declares only generic 400 and 500 responses; the codes below are the
  published common-error registry that actually fires on the VPN action surface, read
  from the EC2 API Reference. Codes are stable strings — an agent should branch on
  <Code>, not on the HTTP status, because several distinct conditions share status 400
  and 403.
envelope:
  content_type: text/xml
  shape: Response.Errors.Error[]
  fields:
    code: Response.Errors.Error.Code
    message: Response.Errors.Error.Message
    request_id: Response.RequestID
  note: >-
    Always capture RequestID. It is the only correlation identifier AWS Support will
    act on, and it is returned on errors as well as on success.
problems:
  - code: AccessDeniedException
    status: 403
    title: Not permitted to perform this action
    detail: You don't have permission to perform this action.
    remediation: Verify that the calling principal's IAM policy grants the ec2:* VPN action.
    retryable: false
  - code: NotAuthorized
    status: 401
    title: Not authorized
    detail: You don't have permissions to perform this action.
    remediation: Verify that your IAM policy includes the required permissions.
    retryable: false
  - code: ExpiredTokenException
    status: 403
    title: Security token expired
    detail: The security token included in the request has expired.
    remediation: Request a new security token and try again.
    retryable: true
  - code: UnrecognizedClientException
    status: 403
    title: Unknown credentials
    detail: The X.509 certificate or AWS access key ID you provided doesn't exist in our records.
    remediation: Verify that you're using valid, unexpired credentials.
    retryable: false
  - code: MissingAuthenticationToken
    status: 403
    title: Missing credentials
    detail: The request must contain a valid AWS access key ID or X.509 certificate.
    remediation: Sign the request with AWS Signature Version 4.
    retryable: false
  - code: IncompleteSignature
    status: 400
    title: Malformed SigV4 signature
    detail: The request signature doesn't conform to AWS standards.
    remediation: Use a current AWS SDK, or re-check the canonical request and signing key derivation.
    retryable: false
  - code: OptInRequired
    status: 403
    title: Service not enabled for this account
    detail: Your AWS account needs a subscription for this service.
    remediation: Enable the service in the account.
    retryable: false
  - code: MissingAction
    status: 400
    title: Action parameter missing
    detail: The request is missing the Action parameter.
    remediation: Add Action=<VpnOperation> — for example Action=DescribeVpnConnections.
    retryable: false
    source_operation: openapi/amazon-vpn-aws-vpn-api-amazon-ec2-query-api-subset-api-openapi.yml#invokeVpnAction
  - code: MissingParameter
    status: 400
    title: Required parameter missing
    detail: A required parameter for the specified action isn't included in the request.
    remediation: Add the missing parameter named in the message.
    retryable: false
    source_operation: openapi/amazon-vpn-aws-vpn-api-amazon-ec2-query-api-subset-api-openapi.yml#invokeVpnAction
  - code: InvalidParameterValue
    status: 400
    title: Invalid parameter value
    detail: A value that you provided for a parameter isn't valid.
    remediation: Check the parameter constraints in the action's API reference page.
    retryable: false
  - code: InvalidParameterCombination
    status: 400
    title: Conflicting parameters
    detail: Parameters that must not be used together were used together.
    remediation: Remove one of the conflicting parameters.
    retryable: false
  - code: InvalidQueryParameter
    status: 400
    title: Malformed query string
    detail: The AWS query string is malformed or doesn't adhere to AWS standards.
    remediation: Verify the form-encoded query string format.
    retryable: false
  - code: MalformedQueryString
    status: 404
    title: Query string syntax error
