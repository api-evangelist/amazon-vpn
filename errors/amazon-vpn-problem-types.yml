    remediation: Regenerate the request with a current timestamp and correct clock skew.
    retryable: true
  - code: ThrottlingException
    status: 400
    title: Request rate too high
    detail: Your request rate is too high.
    remediation: Back off exponentially with jitter. AWS SDKs retry this automatically.
    retryable: true
    see_also: rate-limits/amazon-vpn-rate-limits.yml
  - code: RequestLimitExceeded
    status: 503
    title: API throttling limit exceeded
