source: >-
  Public registry metadata endpoints (registry.npmjs.org, pypi.org, rubygems.org,
  repo.packagist.org, crates.io, api.nuget.org, repo1.maven.org, proxy.golang.org)
  queried 2026-09-01, plus https://aws.amazon.com/developer/tools/
note: >-
  AWS VPN has no VPN-specific client library. Site-to-Site VPN and Client VPN are
  operated through the Amazon EC2 Query API, so the first-party clients are the AWS
  SDKs' EC2 clients and the AWS CLI. Every package below is published by Amazon Web
  Services (npm @aws-sdk scope, PyPI boto3/botocore, RubyGems aws-sdk-ec2, Packagist
  aws/aws-sdk-php, crates.io aws-sdk-ec2, NuGet AWSSDK.*, Maven software.amazon.awssdk,
  Go github.com/aws/aws-sdk-go-v2) and each ships the VPN operations of the EC2 API
  (CreateVpnConnection, DescribeVpnConnections, CreateClientVpnEndpoint, ...).
  Currency is the finding: every release below is dated within days of this probe.
